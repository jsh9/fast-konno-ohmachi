name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
            portable: true
            python: "3.10"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: auto
            portable: true
            python: "3.10"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            portable: false
            python: "3.10"
          - os: windows-11-arm
            # actions/python-versions has no Windows arm64 CPython 3.10.
            # 3.12 is the oldest release that also has current NumPy and SciPy wheels.
            # PyO3 abi3-py310 still tags the wheel cp310-abi3.
            target: aarch64-pc-windows-msvc
            portable: false
            python: "3.12"
          - os: macos-latest
            target: aarch64-apple-darwin
            portable: false
            python: "3.10"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            portable: false
            python: "3.10"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Choose the Python 3.10 interpreter
        shell: bash
        run: |
          # Linux builds run inside the manylinux container, which has python3.10.
          # Elsewhere, point maturin at the interpreter setup-python installed.
          # Copying python.exe off to the side breaks the Windows layout, so keep
          # the real path.
          if command -v python3.10 >/dev/null 2>&1; then
            echo "PYTHON_INTERPRETER=python3.10" >> "$GITHUB_ENV"
          elif [ -n "${pythonLocation:-}" ] && [ -x "$pythonLocation/python.exe" ]; then
            interp="${pythonLocation}/python.exe"
            interp=$(printf '%s' "$interp" | sed 's|\\|/|g')
            echo "PYTHON_INTERPRETER=$interp" >> "$GITHUB_ENV"
          elif [ -n "${pythonLocation:-}" ] && [ -x "$pythonLocation/python" ]; then
            echo "PYTHON_INTERPRETER=$pythonLocation/python" >> "$GITHUB_ENV"
          else
            echo "PYTHON_INTERPRETER=$(command -v python)" >> "$GITHUB_ENV"
          fi

      - name: Build the Linux wheel
        if: matrix.portable
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.10
          manylinux: ${{ matrix.manylinux }}

      - name: Build the wheel
        if: ${{ !matrix.portable }}
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i ${{ env.PYTHON_INTERPRETER }}

      - name: Install the wheel and run pytest
        shell: bash
        run: |
          python -m venv .venv
          if [ -f .venv/bin/activate ]; then
            source .venv/bin/activate
          else
            source .venv/Scripts/activate
          fi
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -m pip install -r requirements-test.txt
          pytest

      - name: Upload the wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload the sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [build, sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Download wheels and sdist
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
