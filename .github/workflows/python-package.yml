name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  rust:
    name: cargo fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Run the Rust unit tests
        run: cargo test
        env:
          PYO3_PYTHON: python

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint the Python files
        run: |
          python -m pip install ruff
          ruff check .

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
            portable: true
            python: "3.10"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: auto
            portable: true
            python: "3.10"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            portable: false
            python: "3.10"
          - os: windows-11-arm
            # actions/python-versions has no Windows arm64 CPython 3.10.
            # 3.12 is the oldest release that also has current NumPy and SciPy wheels.
            # PyO3 abi3-py310 still tags the wheel cp310-abi3.
            target: aarch64-pc-windows-msvc
            portable: false
            python: "3.12"
          - os: macos-latest
            target: aarch64-apple-darwin
            portable: false
            python: "3.10"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            portable: false
            python: "3.10"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Choose the Python 3.10 interpreter
        shell: bash
        run: |
          # Linux builds run inside the manylinux container, which has python3.10.
          # Elsewhere, point maturin at the interpreter setup-python installed.
          # Copying python.exe off to the side breaks the Windows layout, so keep
          # the real path.
          if command -v python3.10 >/dev/null 2>&1; then
            echo "PYTHON_INTERPRETER=python3.10" >> "$GITHUB_ENV"
          elif [ -n "${pythonLocation:-}" ] && [ -x "$pythonLocation/python.exe" ]; then
            interp="${pythonLocation}/python.exe"
            interp=$(printf '%s' "$interp" | sed 's|\\|/|g')
            echo "PYTHON_INTERPRETER=$interp" >> "$GITHUB_ENV"
          elif [ -n "${pythonLocation:-}" ] && [ -x "$pythonLocation/python" ]; then
            echo "PYTHON_INTERPRETER=$pythonLocation/python" >> "$GITHUB_ENV"
          else
            echo "PYTHON_INTERPRETER=$(command -v python)" >> "$GITHUB_ENV"
          fi

      - name: Build the Linux wheel
        if: matrix.portable
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.10
          manylinux: ${{ matrix.manylinux }}

      - name: Build the wheel
        if: ${{ !matrix.portable }}
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i ${{ env.PYTHON_INTERPRETER }}

      - name: Install the wheel and run pytest
        shell: bash
        run: |
          python -m venv .venv
          if [ -f .venv/bin/activate ]; then
            source .venv/bin/activate
          else
            source .venv/Scripts/activate
          fi
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -m pip install -r requirements-test.txt
          python -c "import fast_konno_ohmachi as ko; assert callable(ko.smooth)"
          pytest

      - name: Upload the wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  test-py313:
    name: abi3 wheel on Python 3.13
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download the Linux x86_64 wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel-x86_64-unknown-linux-gnu
          path: dist

      - name: Install the wheel and run pytest
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -m pip install -r requirements-test.txt
          python -c "import sys, fast_konno_ohmachi as ko; assert sys.version_info[:2] == (3, 13); assert callable(ko.smooth)"
          pytest

  test-numpy1:
    name: abi3 wheel on NumPy 1.x
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download the Linux x86_64 wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel-x86_64-unknown-linux-gnu
          path: dist

      - name: Install the wheel with NumPy 1.x and run pytest
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" dist/*.whl -r requirements-test.txt
          python -c "import numpy; assert numpy.__version__.startswith('1.'), numpy.__version__"
          pytest
